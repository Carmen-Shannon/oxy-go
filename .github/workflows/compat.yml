# Compatibility Workflow
#
# Verifies that the library compiles and all tests pass on macOS and Windows.
# No coverage is collected; this check exists solely to confirm cross-platform
# build and test compatibility.

name: Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Go dependencies
        run: go mod download

      - name: Install mockery
        run: go install github.com/vektra/mockery/v2@v2.53.5

      - name: Generate mocks
        run: mockery

      - name: Run tests
        shell: bash
        run: |
          TESTS=$(go list ./common/... ./engine/... | grep -v '/mocks$')
          go test -count=1 ${TESTS}

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Go dependencies
        run: go mod download

      - name: Install Mesa software Vulkan
        shell: bash
        run: |
          MESA_VERSION="25.2.7"
          curl.exe -L --retry 5 "https://github.com/pal1000/mesa-dist-win/releases/download/${MESA_VERSION}/mesa3d-${MESA_VERSION}-release-msvc.7z" -o mesa.7z
          mkdir -p mesa
          7z.exe e mesa.7z -omesa x64/vulkan_lvp.dll x64/lvp_icd.x86_64.json
          MESA_DIR="$(cygpath --windows "$(pwd)/mesa")"
          echo "VK_DRIVER_FILES=${MESA_DIR}\\lvp_icd.x86_64.json" >> "$GITHUB_ENV"
          echo "GALLIUM_DRIVER=llvmpipe" >> "$GITHUB_ENV"

      - name: Install mockery
        run: go install github.com/vektra/mockery/v2@v2.53.5

      - name: Generate mocks
        run: mockery

      - name: Run tests
        shell: bash
        run: |
          TESTS=$(go list ./common/... ./engine/... | grep -v '/mocks$')
          go test -count=1 ${TESTS}
