# Coverage Badge Workflow
#
# Runs all tests with coverage for the common and engine packages (and all
# sub-packages) on Linux, then uploads the report to Codecov.

name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Go dependencies
        run: go mod download

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xorg-dev \
            libgl1-mesa-dev \
            libvulkan1 \
            mesa-vulkan-drivers \
            xvfb

      - name: Install mockery
        run: go install github.com/vektra/mockery/v2@v2.53.5

      - name: Generate mocks
        run: mockery

      - name: Run tests with coverage
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: |
          PKGS=$(go list ./common/... ./engine/... | grep -v '/mocks$' | paste -sd,)
          TESTS=$(go list ./common/... ./engine/... | grep -v '/mocks$')
          xvfb-run go test -coverprofile="coverage.out" -coverpkg="${PKGS}" ${TESTS}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
