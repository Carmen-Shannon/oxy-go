# Coverage Badge Workflow
#
# Runs all tests with coverage for the common and engine packages, then
# pushes a shields.io-compatible JSON endpoint to a GitHub Gist.

name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: go mod download

      - name: Run tests with coverage
        run: |
          go test ./tests/... \
            -count=1 \
            -coverpkg="github.com/Carmen-Shannon/oxy-go/common/...,github.com/Carmen-Shannon/oxy-go/engine/..." \
            -coverprofile="coverage.out"

      - name: Extract coverage percentage
        id: cov
        run: |
          COVERAGE=$(go tool cover -func="coverage.out" | grep '^total:' | awk '{print $NF}' | tr -d '%')
          echo "pct=${COVERAGE}" >> "$GITHUB_OUTPUT"
          echo "Coverage: ${COVERAGE}%"

      - name: Determine badge color
        id: badge
        run: |
          PCT=${{ steps.cov.outputs.pct }}
          # Convert to integer for comparison (bash doesn't do float comparison)
          INT_PCT=${PCT%.*}
          if   [ "$INT_PCT" -ge 90 ]; then COLOR="brightgreen"
          elif [ "$INT_PCT" -ge 80 ]; then COLOR="green"
          elif [ "$INT_PCT" -ge 70 ]; then COLOR="yellowgreen"
          elif [ "$INT_PCT" -ge 60 ]; then COLOR="yellow"
          elif [ "$INT_PCT" -ge 50 ]; then COLOR="orange"
          else                              COLOR="red"
          fi
          echo "color=${COLOR}" >> "$GITHUB_OUTPUT"

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            ### Coverage Report
            **Total coverage: ${{ steps.cov.outputs.pct }}%**
          comment-tag: coverage-report

      - name: Update Gist badge endpoint
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ secrets.GIST_ID }}
          filename: oxy-go-coverage.json
          label: coverage
          message: ${{ steps.cov.outputs.pct }}%
          color: ${{ steps.badge.outputs.color }}
